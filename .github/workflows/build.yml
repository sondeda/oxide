name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Get zygisk.hpp
        run: |
          mkdir -p include
          wget -q https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -O include/zygisk.hpp

      - name: Build
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build -S .
          cmake --build build

      - name: Package
        run: |
          mkdir -p zygisk
          cp build/arm64-v8a.so zygisk/arm64-v8a.so
          python3 - <<'PYEOF'
          import zipfile
          files = [
            ('module.prop', 'module.prop'),
            ('META-INF/com/google/android/update-binary', 'META-INF/com/google/android/update-binary'),
            ('META-INF/com/google/android/updater-script', 'META-INF/com/google/android/updater-script'),
            ('zygisk/arm64-v8a.so', 'zygisk/arm64-v8a.so'),
          ]
          with zipfile.ZipFile('OxideCheat.zip', 'w', zipfile.ZIP_DEFLATED) as z:
            for src, dst in files:
              z.write(src, dst)
              print(f'Added: {dst}')
          PYEOF

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OxideCheat
          path: OxideCheat.zip
